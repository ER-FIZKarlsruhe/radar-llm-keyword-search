<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="unsafe-url">
    <title>Keyword-Extraktion</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
        textarea { width: 100%; min-height: 14rem; box-sizing: border-box; font: inherit; padding: .5rem; }
        button { margin-top: .5rem; padding: .5rem 1.25rem; font: inherit; cursor: pointer; }
        button:disabled { cursor: wait; opacity: .6; }
        #status { margin-top: 1rem; }
        #status.error { color: #b00020; }
        pre { background: #f4f4f4; padding: .75rem; overflow-x: auto; }
        fieldset { border: none; padding: 0; margin: 1rem 0 0; }
        fieldset label { margin-right: 1rem; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; font-size: .95em; }
        th, td { border-bottom: 1px solid #ddd; padding: .3rem .5rem; text-align: left; vertical-align: top; }
        th { background: #f4f4f4; }
        .none { color: #666; font-style: italic; }
    </style>
</head>
<body>
<h1>Keyword-Extraktion</h1>
<form id="extract-form">
    <input type="hidden" name="model" value="keyword-extractor">
    <label for="text">Text</label>
    <textarea id="text" name="text" required maxlength="100000"></textarea>
    <fieldset>
        <legend>Normdaten-Abgleich</legend>
        <label><input type="radio" name="terminology" value="none" checked> keiner</label>
        <label><input type="radio" name="terminology" value="gnd"> GND</label>
        <label><input type="radio" name="terminology" value="tib"> TIB</label>
        <label><input type="radio" name="terminology" value="both"> GND und TIB</label>
    </fieldset>
    <button type="submit" id="submit">Keywords extrahieren</button>
</form>
<div id="status" role="status" aria-live="polite"></div>
<section id="result" hidden>
    <h2>Ergebnis</h2>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>Keyword</th><th>Quelle</th><th>Label</th><th>Treffer über</th><th>Ontologie</th>
                <th>Schema</th><th>Code</th></tr>
            </thead>
            <tbody id="keywords"></tbody>
        </table>
    </div>
    <details>
        <summary>JSON-Antwort</summary>
        <pre id="raw"></pre>
    </details>
</section>
<script>
    // All server data is rendered via textContent to avoid HTML injection.
    const form = document.getElementById("extract-form");
    const submit = document.getElementById("submit");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    function showStatus(message, isError) {
        status.textContent = message;
        status.className = isError ? "error" : "";
    }

    function errorMessage(response, body) {
        const detail = body && (body.detail || body.title);
        return "Fehler " + response.status + (detail ? ": " + detail : "");
    }

    function cell(row, value) {
        const td = document.createElement("td");
        td.textContent = value === null || value === undefined || value === "" ? "–" : String(value);
        row.appendChild(td);
        return td;
    }

    function isHttpUrl(value) {
        try {
            const url = new URL(value);
            return url.protocol === "http:" || url.protocol === "https:";
        } catch (e) {
            return false;
        }
    }

    function render(body, terminology) {
        const tbody = document.getElementById("keywords");
        tbody.replaceChildren();
        for (const [keyword, match] of Object.entries(body || {})) {
            const row = tbody.insertRow();
            cell(row, keyword);
            if (!match) {
                const none = cell(row, terminology === "none" ? "" : "Kein Treffer.");
                none.colSpan = 6;
                none.className = "none";
                continue;
            }
            cell(row, match.source);
            const label = cell(row, match.label);
            if (match.iri && isHttpUrl(match.iri)) {
                const link = document.createElement("a");
                link.href = match.iri;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = match.label || match.iri;
                label.replaceChildren(link);
            }
            cell(row, match.best_term);
            cell(row, match.ontology_name);
            cell(row, match.keyword_scheme);
            cell(row, match.classification_code);
        }
        document.getElementById("raw").textContent = JSON.stringify(body, null, 2);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = document.getElementById("text").value;
        if (!text.trim()) {
            showStatus("Bitte einen Text eingeben.", true);
            return;
        }
        const terminology = form.querySelector("input[name=terminology]:checked").value;
        const model = document.getElementById("model").value;
        submit.disabled = true;
        result.hidden = true;
        showStatus(terminology === "none" ? "Extrahiere Keywords …" : "Extrahiere Keywords und gleiche Normdaten ab …", false);
        try {
            // Relative URL: this page is served at GET .../extract, the API is POST .../extract.
            const response = await fetch("extract", {
                method: "POST",
                headers: {"Content-Type": "application/json", "Accept": "application/json"},
                body: JSON.stringify({text: text, terminology: terminology, model: model})
            });
            const body = await response.json().catch(() => null);
            if (!response.ok) {
                showStatus(errorMessage(response, body), true);
                return;
            }
            render(body, terminology);
            const entries = Object.values(body || {});
            const hits = entries.filter(match => match).length;
            showStatus(entries.length + " Keywords gefunden"
                + (terminology === "none" ? "." : ", " + hits + " mit Normdaten-Treffer."), false);
            result.hidden = false;
        } catch (error) {
            showStatus("Anfrage fehlgeschlagen: " + error.message, true);
        } finally {
            submit.disabled = false;
        }
    });
</script>
</body>
</html>
