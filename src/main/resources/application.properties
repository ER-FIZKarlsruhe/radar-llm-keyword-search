spring.application.name=radar-llm-keyword-search
spring.mvc.problemdetails.enabled=true

# Optional HTTP proxy for all outgoing requests (Ollama, GND, TIB); empty host = direct connection
radar.http.proxy.host=proxy.fiz-karlsruhe.de
radar.http.proxy.port=8888

# Ollama server with the keyword-extractor model (see docs/Keyword-Extractor-Model1.md)
radar.ollama.base-url=https://llm.radar-service.eu/ollama
radar.ollama.models=keyword-extractor,keyword-extractor1,keyword-extractor2
radar.ollama.connect-timeout=60s
radar.ollama.read-timeout=120s
radar.ollama.max-keywords=10

# lobid-gnd search API
radar.gnd.base-url=https://lobid.org/gnd
radar.gnd.max-results=10
radar.gnd.connect-timeout=5s
radar.gnd.read-timeout=10s

# TIB Terminology Service search API
radar.tib.base-url=https://api.terminology.tib.eu/api
radar.tib.max-results=10
# Comma separated ontology ids (e.g. chebi,gnd), empty searches all ontologies
radar.tib.ontologies=
radar.tib.connect-timeout=5s
radar.tib.read-timeout=10s

# Upper bound of simultaneous GND/TIB requests across all incoming requests
radar.matching.max-concurrent-requests=8
